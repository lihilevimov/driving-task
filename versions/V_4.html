<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Continuous Road Pilot V_4</title>
<style>
:root {
  --yellow: #f2c94c;
  --green: #43d17b;
  --red: #ff5c68;
  --road: #32373e;
  --shoulder: #3b4048;
  --panel: #111a2a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at top, #263754, #0b1019 70%);
  color: #fff;
  font-family: 'Segoe UI', Arial, sans-serif;
  user-select: none;
}
.app { width: min(94vw, 760px); padding: 12px; }
.shell {
  overflow: hidden;
  border: 1px solid #3c4a62;
  border-radius: 18px;
  background: #121b2b;
  box-shadow: 0 20px 60px #0009;
}
.hud {
  height: 62px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #101827;
  position: relative;
  z-index: 40;
}
.meta { font-size: 13px; color: #aab4c6; text-transform: uppercase; letter-spacing: 0.5px; }
.score {
  font-size: 22px;
  font-weight: 800;
  color: var(--green);
  padding: 4px 12px;
  border-radius: 8px;
  transition: transform 0.22s ease, color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
}
.score.pulse-gain {
  transform: scale(1.16);
  color: #69f09c;
  background: rgba(67, 209, 123, 0.18);
  box-shadow: 0 0 16px rgba(67, 209, 123, 0.45);
}
.score.pulse-loss {
  transform: scale(1.18);
  color: #ff6b76;
  background: rgba(255, 92, 104, 0.22);
  box-shadow: 0 0 18px rgba(255, 92, 104, 0.55);
}

.stage {
  position: relative;
  height: 540px;
  overflow: hidden;
  direction: ltr;
  background:
    linear-gradient(90deg,
      #23391e 0%,
      #2d4727 8.5%,
      #20331b 9.5%,
      #20331b 90.5%,
      #2d4727 91.5%,
      #23391e 100%);
}
.roadbase { position: absolute; inset: 0; z-index: 1; }
.roadbase .walkwayL,
.roadbase .walkwayR,
.roadbase .leftShoulder,
.roadbase .rightShoulder,
.roadbase .road,
.roadbase .edgeL,
.roadbase .edgeR,
.roadbase .guardL,
.roadbase .guardR,
.roadbase .divider {
  position: absolute;
  top: 0;
  bottom: 0;
}

/* Pedestrian Park Walking Paths outside the highway guardrails */
.walkwayL {
  left: 1.6%;
  width: 3.4%;
  background:
    repeating-linear-gradient(180deg, #b89f82 0 22px, #ab9276 22px 24px);
  border-left: 1.5px solid #8a7359;
  border-right: 1.5px solid #8a7359;
  box-shadow: 0 0 6px #0006;
  z-index: 2;
}
.walkwayR {
  right: 1.6%;
  width: 3.4%;
  background:
    repeating-linear-gradient(180deg, #b89f82 0 22px, #ab9276 22px 24px);
  border-left: 1.5px solid #8a7359;
  border-right: 1.5px solid #8a7359;
  box-shadow: 0 0 6px #0006;
  z-index: 2;
}

/* Elevated 3D Galvanized Steel W-Beam Guardrail casting a strong shadow onto the asphalt shoulder */
.guardL {
  left: 8.8%;
  width: 12px;
  background:
    linear-gradient(90deg,
      #394047 0%,
      #bcc6d0 18%,
      #eef5fc 36%,
      #6c757e 54%,
      #d8e2ec 76%,
      #434a52 100%);
  border-left: 1px solid #2b3036;
  border-right: 1.5px solid #252a30;
  box-shadow:
    11px 0 14px -1px rgba(0, 0, 0, 0.78),
    5px 0 5px 0 rgba(0, 0, 0, 0.65),
    -4px 0 8px 0 rgba(0, 0, 0, 0.6);
  z-index: 5;
}
.guardR {
  right: 8.8%;
  width: 12px;
  background:
    linear-gradient(90deg,
      #434a52 0%,
      #d8e2ec 24%,
      #6c757e 46%,
      #eef5fc 64%,
      #bcc6d0 82%,
      #394047 100%);
  border-left: 1.5px solid #252a30;
  border-right: 1px solid #2b3036;
  box-shadow:
    -11px 0 14px -1px rgba(0, 0, 0, 0.78),
    -5px 0 5px 0 rgba(0, 0, 0, 0.65),
    4px 0 8px 0 rgba(0, 0, 0, 0.6);
  z-index: 5;
}

/* Smooth continuous asphalt shoulders */
.leftShoulder {
  left: 10%;
  width: 13%;
  background:
    linear-gradient(90deg, #00000045 0%, transparent 24%, #ffffff05 60%, #00000020 100%),
    var(--shoulder);
}
.rightShoulder {
  right: 10%;
  width: 13%;
  background:
    linear-gradient(90deg, #00000020 0%, #ffffff05 40%, transparent 76%, #00000045 100%),
    var(--shoulder);
}

.road {
  left: 23%;
  right: 23%;
  background:
    linear-gradient(90deg,
      #00000022 0%,
      transparent 14%,
      #ffffff06 25%,
      transparent 36%,
      #00000020 50%,
      transparent 64%,
      #ffffff06 75%,
      transparent 86%,
      #00000022 100%),
    var(--road);
  box-shadow: 0 0 0 1px #20252b inset;
}
.edgeL { left: 23%; width: 4px; background: var(--yellow); z-index: 2; }
.edgeR { right: 23%; width: 4px; background: var(--yellow); z-index: 2; }
.divider {
  left: calc(50% - 2.5px);
  width: 5px;
  background: repeating-linear-gradient(to bottom, #f0f3f7 0 32px, transparent 32px 68px);
  background-position-y: 0;
  z-index: 2;
}
.roadbase.driving .divider {
  animation: laneFlow .31s linear infinite;
}
.roadbase.driving.crawl .divider {
  animation: laneFlow .55s linear infinite;
}
.roadbase.driving.fast .divider {
  animation: laneFlow .17s linear infinite;
}
@keyframes laneFlow {
  to { background-position-y: 68px; }
}
.roadworld {
  position: absolute;
  left: 0;
  right: 0;
  top: -36000px;
  height: 40000px;
  z-index: 4;
  will-change: transform;
}

/* Dedicated screen-space layer for all NPC traffic cars */
.traffic-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

/* ==========================================
   TALL GUARDRAIL POSTS & PARK SCENERY
   ========================================== */
.scenery {
  position: absolute;
  z-index: 3;
  pointer-events: none;
}
.guard-postL, .guard-postR {
  position: absolute;
  width: 14px;
  height: 18px;
  border-radius: 3px;
  background: linear-gradient(180deg, #eef4fa 0%, #9aa4ae 55%, #5b636b 100%);
  border: 1.5px solid #2f353b;
  z-index: 6;
}
.guard-postL {
  left: calc(8.8% - 2px);
  border-right: 3.5px solid #ff4d4f;
  box-shadow: 7px 3px 8px rgba(0, 0, 0, 0.75);
}
.guard-postR {
  right: calc(8.8% - 2px);
  border-left: 3.5px solid #ff4d4f;
  box-shadow: -7px 3px 8px rgba(0, 0, 0, 0.75);
}

/* ==========================================
   UNIFIED VEHICLE ANATOMY WITH #ID ON ROOF OF ALL CARS
   ========================================== */
.car {
  position: absolute;
  width: 48px;
  height: 82px;
  margin-left: -24px;
  z-index: 10;
  will-change: top, left, transform;
}
.car-chassis {
  position: relative;
  width: 100%;
  height: 100%;
  border: 2px solid #dfe9f5;
  border-radius: 14px 14px 10px 10px;
  background: var(--car-color, #2987e8);
  box-shadow: 0 10px 18px #000a, inset 0 0 8px #ffffff26;
  transition: transform 0.34s cubic-bezier(.22,.8,.25,1);
}
.car.steer-right .car-chassis {
  transform: rotate(7.5deg);
}
.car.steer-left .car-chassis {
  transform: rotate(-7.5deg);
}

.mirror {
  position: absolute;
  top: 20px;
  width: 6px;
  height: 9px;
  background: var(--car-color, #2987e8);
  border: 1.5px solid #dfe9f5;
  border-radius: 3px;
}
.mirror.left { left: -6px; border-right: 0; border-radius: 4px 0 0 3px; }
.mirror.right { right: -6px; border-left: 0; border-radius: 0 4px 3px 0; }

.windshield {
  position: absolute;
  top: 11px;
  left: 6px;
  right: 6px;
  height: 15px;
  border-radius: 6px 6px 3px 3px;
  background: linear-gradient(180deg, #1b283c, #0f1826);
  border: 1px solid #ffffff30;
}
.roof {
  position: absolute;
  top: 27px;
  left: 5px;
  right: 5px;
  height: 30px;
  border-radius: 4px;
  background: rgba(10, 16, 28, 0.32);
  border: 1px solid rgba(255, 255, 255, 0.24);
  display: flex;
  align-items: center;
  justify-content: center;
}
.roof-id {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.2px;
  color: #ffffff;
  text-shadow: 0 1px 3px #000e, 0 0 2px #000;
  font-family: 'Segoe UI', Arial, sans-serif;
  line-height: 1;
}
.rear-window {
  position: absolute;
  bottom: 10px;
  left: 7px;
  right: 7px;
  height: 12px;
  border-radius: 3px 3px 5px 5px;
  background: linear-gradient(0deg, #1b283c, #0f1826);
  border: 1px solid #ffffff24;
}
.headlight {
  position: absolute;
  top: 1px;
  width: 9px;
  height: 4px;
  border-radius: 3px;
  background: #fff9db;
  box-shadow: 0 -8px 12px 2px #fff6b366;
}
.headlight.left { left: 6px; }
.headlight.right { right: 6px; }

.brakelight {
  position: absolute;
  bottom: 1px;
  width: 11px;
  height: 4.5px;
  border-radius: 2px;
  background: #7a1c24;
  transition: background 0.15s, box-shadow 0.15s;
}
.brakelight.left { left: 5px; }
.brakelight.right { right: 5px; }
.car.braking .brakelight {
  background: #ff2a3a;
  box-shadow: 0 4px 12px 3px #ff1e2e99, 0 0 6px 1px #ff8088;
}
.car.hard-brake .brakelight {
  background: #ff4552;
  box-shadow: 0 6px 18px 6px #ff1e2ecc, 0 0 10px 2px #ffb3b8;
}

.signal {
  position: absolute;
  width: 7px;
  height: 5px;
  border-radius: 2px;
  background: #594318;
  opacity: 0.35;
}
.signal.front-left  { top: 2px; left: 1px; }
.signal.front-right { top: 2px; right: 1px; }
.signal.rear-left   { bottom: 2px; left: 1px; }
.signal.rear-right  { bottom: 2px; right: 1px; }

@keyframes blinkAmber {
  0%, 48% {
    background: #ffae00;
    opacity: 1;
    box-shadow: 0 0 11px 4px #ff9900cc, 0 0 4px 1px #fff;
  }
  50%, 100% {
    background: #594318;
    opacity: 0.3;
    box-shadow: none;
  }
}
.car.blink-left .signal.front-left,
.car.blink-left .signal.rear-left {
  animation: blinkAmber 0.34s steps(1) infinite;
}
.car.blink-right .signal.front-right,
.car.blink-right .signal.rear-right {
  animation: blinkAmber 0.34s steps(1) infinite;
}

.player {
  left: 63.5%;
  top: 338px;
  z-index: 18;
  --car-color: #2987e8;
  transition: left .42s cubic-bezier(.22,.82,.25,1), top .58s cubic-bezier(.22,.78,.24,1);
}
.npc {
  transition: left .48s cubic-bezier(.22,.8,.25,1), top .75s cubic-bezier(.25,.72,.25,1);
}

/* ==========================================
   DEAD-CENTER EXPANDING FEEDBACK
   ========================================== */
.feedback {
  position: absolute;
  z-index: 35;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-weight: 900;
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
  padding: 8px 22px;
  border-radius: 16px;
  will-change: transform, opacity;
}
.gain {
  font-size: 64px;
  color: #52f28e;
  background: rgba(12, 24, 18, 0.72);
  border: 2px solid rgba(82, 242, 142, 0.55);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8), 0 0 24px rgba(67, 209, 123, 0.35);
  text-shadow: 0 4px 14px #000;
}
.loss {
  font-size: 54px;
  color: #ff6672;
  background: rgba(24, 8, 12, 0.88);
  border: 2.5px solid rgba(255, 92, 104, 0.85);
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.9), 0 0 28px rgba(255, 92, 104, 0.5);
  text-shadow: 0 4px 12px #000;
}

@keyframes expandCenter {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.52);
  }
  16% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(0.96);
  }
  86% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.36);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.46);
  }
}

.controls {
  min-height: 144px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 13px 18px 18px;
  background: var(--panel);
}
.pad {
  direction: ltr !important;
  display: grid;
  grid-template-columns: 58px 58px 58px;
  grid-template-rows: 51px 51px;
  gap: 6px;
}
.key {
  border: 1px solid #526079;
  border-radius: 10px;
  background: #263249;
  color: #fff;
  font-size: 25px;
  font-weight: 800;
  box-shadow: 0 4px 0 #080d16;
  cursor: pointer;
  transition: transform 0.08s, background 0.15s, opacity 0.15s;
}
.key:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #080d16;
}
.key:disabled { opacity: .45; cursor: default; }
.up { grid-column: 2; grid-row: 1; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }
.hint {
  max-width: 270px;
  color: #aab4c6;
  font-size: 14px;
  line-height: 1.45;
}
.overlay {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 25px;
  text-align: center;
  background: #0f1726f5;
}
.card { max-width: 530px; }
.card p { color: #d5dbe6; line-height: 1.55; }
.btn {
  margin: 6px;
  padding: 11px 22px;
  border: 0;
  border-radius: 10px;
  background: #3d8bfd;
  color: #fff;
  font-weight: 750;
  font-size: 15px;
  cursor: pointer;
}
.btn.secondary { background: #3a475e; }
.btn.active-lang { outline: 2px solid #fff; }
.test-panel {
  margin: 14px auto 8px;
  padding: 10px 14px;
  border-radius: 10px;
  background: #19253a;
  border: 1px solid #334460;
  font-size: 13px;
  color: #b8c4d9;
  direction: ltr;
  line-height: 1.8;
}
.test-panel select {
  margin: 3px 6px;
  padding: 4px 8px;
  border-radius: 6px;
  background: #0e1624;
  color: #fff;
  border: 1px solid #455878;
}
.hidden { display: none !important; }
@media(max-width: 600px) {
  .stage { height: 470px; }
  .controls { flex-direction: column; gap: 12px; }
}
</style>
</head>
<body>
<main class="app">
  <section class="shell">
    <header class="hud">
      <div>
        <div class="meta" id="phase">TEST MODE</div>
        <div id="trial">Trial 0 / 13</div>
      </div>
      <div class="score" id="scoreBox"><span id="pointsLabel">POINTS</span>: <span id="score">2000</span></div>
    </header>

    <div class="stage" id="stage">
      <div class="roadbase" id="roadbase" aria-hidden="true">
        <div class="walkwayL"></div>
        <div class="guardL"></div>
        <div class="leftShoulder"></div>
        <div class="road"></div>
        <div class="rightShoulder"></div>
        <div class="guardR"></div>
        <div class="walkwayR"></div>
        <div class="edgeL"></div>
        <div class="edgeR"></div>
        <div class="divider"></div>
      </div>

      <!-- Scrolling roadside scenery layer -->
      <div class="roadworld" id="world">
        <div id="objects"></div>
      </div>

      <!-- Screen-space traffic layer (shares exact coordinate system with #player) -->
      <div class="traffic-layer" id="trafficLayer"></div>

      <div class="car player braking" id="player"></div>

      <div class="feedback gain" id="gain"></div>
      <div class="feedback loss" id="loss"></div>

      <div class="overlay" id="overlay">
        <div class="card">
          <h1 id="title">Continuous road pilot</h1>
          <p id="intro">Complete the route with as many points as possible. Use the arrow keys or the control pad.</p>
          <div>
            <button class="btn" id="en">English</button>
            <button class="btn secondary" id="he">עברית</button>
          </div>
          <div class="test-panel" id="testPanel">
            <strong>Pilot / Test Controls:</strong><br>
            Social:
            <select id="selSocial">
              <option value="experimental">Experimental (2 Copycats)</option>
              <option value="control">Control (No Copycat)</option>
            </select>
            Deterrence:
            <select id="selDet">
              <option value="random">Random (50/50)</option>
              <option value="high">High Certainty (90% / -50)</option>
              <option value="low">Low Certainty (10% / -450)</option>
            </select><br>
            Shoulder Mode:
            <select id="selShoulderMode">
              <option value="stay">Stay on Shoulder (Continuous)</option>
              <option value="merge">Overtake &amp; Merge Back (Per-Trial)</option>
            </select>
          </div>
          <button class="btn hidden" id="start">Start</button>
        </div>
      </div>
    </div>

    <footer class="controls">
      <div class="pad" dir="ltr">
        <button class="key up" data-key="ArrowUp">↑</button>
        <button class="key left" data-key="ArrowLeft">←</button>
        <button class="key down" data-key="ArrowDown">↓</button>
        <button class="key right" data-key="ArrowRight">→</button>
      </div>
      <div class="hint" id="hint">You can navigate using the mouse or the keyboard arrow keys.</div>
    </footer>
  </section>
</main>

<script>
// ==========================================
// 1. CENTRAL CONFIGURATION (CFG)
// ==========================================
const CFG = {
  testMode: true,
  countsTest: { baseline: 5, socialExposure: 2, exploit: 2, deterrence: 4 },
  countsFull: { baseline: 20, socialExposure: 2, exploit: 4, deterrence: 20 },
  starting: 2000,
  // First trial on which the traffic jam is active (trials before it = open road).
  jamStartTrial: 3,
  openRoadReward: 10,
  jamNormativeReward: 5,
  shoulderReward: 10,
  brakeCost: 5,
  high: { p: 0.9, fine: 50 },
  low: { p: 0.1, fine: 450 },
  freeDriveMs: 1050,
  jamDriveMs: 1650,
  shoulderDriveMs: 1180,
  brakeMs: 520,
  // World-scroll distance per step (px). These were missing in V_3 (-> NaN, scenery froze). Values restored from V_2.
  stepDist: 330,
  shoulderStepDist: 460,
  brakeStepDist: 45,
  playerNormY: 338,
  playerShoulderY: 230,
  rearSlotPlayerY: 448,
  rearSlotOtherY: 464,
  rearSlotFarY: 452
};

// Queue Slots (All cars have height = 82px):
// 1. Player's current normative lane: 3 cars at [0, 98, 196] -> leaves an inviting 60px gap ahead of Player at 338px!
// 2. Adjacent normative lane (can be merged into): 3 cars at [26, 128, 230] -> keeps the merge pocket at ~338px open!
// 3. Far normative lane (when Player is on a shoulder and CANNOT merge into the far lane):
//    4 cars at [12, 120, 228, 336] -> Car #4 sits right at 336px so the far lane has NO empty merge gap!
const SLOTS_AHEAD_OF_PLAYER = [0, 98, 196];
const SLOTS_ADJACENT_LANE   = [26, 128, 230];
const SLOTS_FAR_LANE        = [12, 120, 228, 336];

function isFarLaneWhenOnShoulder(lane, pLaneIdx) {
  const playerLaneName = LANES[pLaneIdx];
  return (
    (playerLaneName === 'shoulder' && lane === 'left') ||
    (playerLaneName === 'leftShoulder' && lane === 'right')
  );
}

function getLaneSlots(lane, pLaneIdx) {
  const playerLaneName = LANES[pLaneIdx];
  if (lane === playerLaneName) {
    return SLOTS_AHEAD_OF_PLAYER;
  }
  if (isFarLaneWhenOnShoulder(lane, pLaneIdx)) {
    return SLOTS_FAR_LANE; // 4 cars filling the far lane continuously
  }
  return SLOTS_ADJACENT_LANE; // 3 cars leaving the merge pocket open in the adjacent lane
}

const TXT = {
  en: {
    points: 'POINTS',
    start: 'Start',
    title: 'Continuous road pilot',
    intro: 'Complete the route with as many points as possible. Use the arrow keys or the control pad.',
    hint: 'You can navigate using the mouse or the keyboard arrow keys.',
    finePrefix: 'FINE: −',
    done: 'Pilot complete',
    download: 'Download JSON Data',
    restart: 'Restart'
  },
  he: {
    points: 'נקודות',
    start: 'התחלה',
    title: 'פיילוט כביש רציף',
    intro: 'המטרה היא לסיים את המסלול עם מספר הנקודות הגבוה ביותר. ניתן להשתמש במקשי החצים או בלוח שעל המסך.',
    hint: 'ניתן לנווט באמצעות העכבר או חיצי המקלדת.',
    finePrefix: 'קנס: −',
    done: 'הפיילוט הסתיים',
    download: 'הורדת נתונים (JSON)',
    restart: 'הפעלה מחדש'
  }
};

const VERSION = 'V_4';
const $ = id => document.getElementById(id);
// Single place that decides whether a trial is in the jam. (Later: alternating jam segments go here.)
const isJamTrial = t => t >= CFG.jamStartTrial;
const activeCounts = () => CFG.testMode ? CFG.countsTest : CFG.countsFull;
const totalTrials = () => Object.values(activeCounts()).reduce((a, b) => a + b, 0);

const LANES = ['leftShoulder', 'left', 'right', 'shoulder'];
let playerLaneIdx = 2;
let playerScreenY = CFG.playerNormY;

function logEvent(type) {
  if (!experimentStartPerf) return;
  events.push({ type, trial, t_ms: Math.round(performance.now() - experimentStartPerf), iso: new Date().toISOString() });
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) trialHiddenCount++;
  logEvent(document.hidden ? 'tab_hidden' : 'tab_visible');
});
window.addEventListener('blur', () => { trialBlurCount++; logEvent('window_blur'); });
window.addEventListener('focus', () => logEvent('window_focus'));

// Fields shared by every trial record.
function baseRecord() {
  return {
    version: VERSION,
    session,
    participant_id: participantId,
    tag: playerTag,
    social_condition: socialCondition,
    deterrence_condition: deterrenceCondition,
    shoulder_mode: shoulderMode,
    trial,
    phase: phaseOf(trial),
    jam: isJamTrial(trial),
    copycat_shown: !!currentCopycat,
    copycat_id: currentCopycat ? currentCopycat.id : null,
    copycat_from_lane: currentCopycat ? currentCopycat.fromLane : null,
    copycat_to_lane: currentCopycat ? currentCopycat.toLane : null,
    input_during_copycat: inputDuringCopycat,
    tab_hidden_count: trialHiddenCount,
    window_blur_count: trialBlurCount,
    iso_time: new Date().toISOString(),
    t_ms: Math.round(performance.now() - experimentStartPerf)
  };
}

// Condition assignment for real (non-test) runs.
// Priority: URL parameters set by the hosting platform (lets the server balance the 2x2 cells),
// otherwise one of the four cells is drawn with equal probability.
function assignConditionsFromUrlOrRandom() {
  const s = URLP.get('social'), d = URLP.get('det'), m = URLP.get('shoulder');
  const validS = ['experimental', 'control'], validD = ['high', 'low'], validM = ['stay', 'merge'];
  if (validS.includes(s) && validD.includes(d)) {
    socialCondition = s;
    deterrenceCondition = d;
    assignmentSource = 'url';
  } else {
    const cells = [['experimental', 'high'], ['experimental', 'low'], ['control', 'high'], ['control', 'low']];
    [socialCondition, deterrenceCondition] = cells[Math.floor(Math.random() * cells.length)];
    assignmentSource = 'random_cell';
  }
  shoulderMode = validM.includes(m) ? m : 'stay';
}
const usedIds = new Set();

function generateUniqueRoofId() {
  if (usedIds.size > 750) usedIds.clear();
  let id;
  do {
    id = '#' + Math.floor(100 + Math.random() * 900);
  } while (usedIds.has(id));
  usedIds.add(id);
  return id;
}

const playerTag = generateUniqueRoofId();

  const formattedId = roofIdText.startsWith('#') ? roofIdText : '#' + roofIdText;
  return `
    <div class="car-chassis">
      <div class="mirror left"></div>
      <div class="mirror right"></div>
      <div class="headlight left"></div>
      <div class="headlight right"></div>
      <div class="signal front-left"></div>
      <div class="signal front-right"></div>
      <div class="windshield"></div>
      <div class="roof"><span class="roof-id">${formattedId}</span></div>
      <div class="rear-window"></div>
      <div class="brakelight left"></div>
      <div class="brakelight right"></div>
      <div class="signal rear-left"></div>
      <div class="signal rear-right"></div>
    </div>
  `;
}

function laneX(lane) {
  if (lane === 'leftShoulder') return 16.5;
  if (lane === 'left') return 36.5;
  if (lane === 'right') return 63.5;
  if (lane === 'shoulder') return 83.5;
  return 63.5;
}

function screenToWorldY(screenY) {
  return screenY - (-36000) - worldOffset;
}
function worldToScreenY(worldY) {
  return worldY + (-36000) + worldOffset;
}

function rand(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}
function randInt(min, max) {
  return Math.floor(min + Math.random() * (max - min + 1));
}

function animateCarTo(car, targetY, durationMs, easing = 'cubic-bezier(.24,.72,.24,1)', brakeAtRatio = 0.74) {
  if (!car || !car.el) return;
  car.y = targetY;
  void car.el.offsetHeight;
  car.el.classList.remove('braking');
  car.el.style.transition = `top ${durationMs}ms ${easing}, left 0.52s cubic-bezier(.22,.8,.25,1)`;
  car.el.style.top = targetY + 'px';

  if (brakeAtRatio > 0 && targetY > -80 && targetY < 520) {
    setTimeout(() => {
      if (car.el && !car.removed) car.el.classList.add('braking');
    }, Math.round(durationMs * brakeAtRatio));
  }
}

  while (lastSceneryWorldY > minWorldY) {
    lastSceneryWorldY -= 64;
    const y = lastSceneryWorldY;
    const stepIdx = Math.abs(Math.round(y / 64));

    const pL = document.createElement('div');
    pL.className = 'guard-postL';
    pL.style.top = y + 'px';
    objects.appendChild(pL);

    const pR = document.createElement('div');
    pR.className = 'guard-postR';
    pR.style.top = y + 'px';
    objects.appendChild(pR);

    if (stepIdx % 4 === 0) {
      const bL = document.createElement('div');
      bL.className = 'scenery';
      bL.innerHTML = getScenerySVG('benchL');
      bL.style.left = '5.2%';
      bL.style.top = (y - 8) + 'px';
      objects.appendChild(bL);

      const tL = document.createElement('div');
      tL.className = 'scenery';
      tL.innerHTML = getScenerySVG('trash');
      tL.style.left = '5.3%';
      tL.style.top = (y + 30) + 'px';
      objects.appendChild(tL);

      const bR = document.createElement('div');
      bR.className = 'scenery';
      bR.innerHTML = getScenerySVG('benchR');
      bR.style.left = '92.0%';
      bR.style.top = (y + 12) + 'px';
      objects.appendChild(bR);

      const tR = document.createElement('div');
      tR.className = 'scenery';
      tR.innerHTML = getScenerySVG('trash');
      tR.style.left = '92.1%';
      tR.style.top = (y - 12) + 'px';
      objects.appendChild(tR);
    }

    if (stepIdx % 2 === 1 && Math.random() < 0.75) {
      const fL = document.createElement('div');
      fL.className = 'scenery';
      fL.innerHTML = getScenerySVG(Math.random() < 0.55 ? 'tree' : 'bush');
      fL.style.left = '0.2%';
      fL.style.top = (y + randInt(-14, 14)) + 'px';
      objects.appendChild(fL);
    }
    if (stepIdx % 2 === 0 && Math.random() < 0.75) {
      const fR = document.createElement('div');
      fR.className = 'scenery';
      fR.innerHTML = getScenerySVG(Math.random() < 0.55 ? 'tree' : 'bush');
      fR.style.left = '95.8%';
      fR.style.top = (y + randInt(-14, 14)) + 'px';
      objects.appendChild(fR);
    }
  }
}

function phaseOf(t) {
  const c = activeCounts();
  if (t <= c.baseline) return 'baseline';
  if (t <= c.baseline + c.socialExposure) return 'social_exposure';
  if (t <= c.baseline + c.socialExposure + c.exploit) return 'exploit';
  return 'deterrence';
}

// ==========================================
// 4. STAGGERED SURROUNDING TRAFFIC ENGINE (v25 - 4-Car Far Lane & Single-Rear-Car Invariant)
// ==========================================
function spawnTrafficCar(screenY, lane, customRoofId = null, colorOverride = null, isRear = false) {
  const roofId = customRoofId || generateUniqueRoofId();
  const d = document.createElement('div');
  d.className = 'car npc braking';
  d.style.transition = 'none';
  d.style.left = laneX(lane) + '%';
  d.style.top = screenY + 'px';
  d.style.setProperty('--car-color', colorOverride || rand(CAR_COLORS));
  d.innerHTML = buildCarAnatomy(roofId);
  $('trafficLayer').appendChild(d);
  void d.offsetHeight;

  const carObj = {
    el: d,
    lane,
    y: screenY,
    roofId,
    jitterY: randInt(-2, 2),
    isCopycat: false,
    removed: false
  };
  if (isRear) rearCars.push(carObj);
  else trafficCars.push(carObj);
  return carObj;
}

function getCopycatLaneForPlayer(pLaneIdx) {
  return pLaneIdx >= 2 ? 'left' : 'right';
}

function getRearSlotForLane(lane, pLaneIdx) {
  const playerLaneName = LANES[pLaneIdx];
  if (lane === playerLaneName) return CFG.rearSlotPlayerY;
  if (isFarLaneWhenOnShoulder(lane, pLaneIdx)) return CFG.rearSlotFarY;
  return CFG.rearSlotOtherY;
}

function evictRearCarsInLane(lane, durationMs) {
  const departing = rearCars.filter(car => car.lane === lane && !car.removed);
  rearCars = rearCars.filter(car => car.lane !== lane || car.removed);
  departing.forEach(car => {
    car.departing = true; // cancels any pending rear-slot animation scheduled earlier in this step
    animateCarTo(car, 600, durationMs, 'cubic-bezier(.24,.72,.24,1)', 0);
    setTimeout(() => {
      if (car.el) car.el.remove();
      car.removed = true;
    }, durationMs + 50);
  });
}

function updateRearTrafficForStep(durationMs, upcomingTrial, maneuverType, newPlayerLaneIdx, targetCopycatLane) {
  if (!isJamTrial(upcomingTrial)) return;

  const isShoulderManeuver = (
    maneuverType === 'enter_shoulder' ||
    maneuverType === 'stay_shoulder' ||
    maneuverType === 'overtake_and_merge'
  );

  ['right', 'left'].forEach(lane => {
    const baseRearY = getRearSlotForLane(lane, newPlayerLaneIdx);
    const laneSlots = getLaneSlots(lane, newPlayerLaneIdx);
    const desiredFrontCount = laneSlots.length; // 3 for player/adjacent lane, 4 for far lane when on shoulder
    const currentFrontCount = trafficCars.filter(car => car.lane === lane && !car.removed).length;

    // Does this lane drop an overtaken front car into rearCars on this step?
    // When 1 new horizon car is unshifted onto currentFrontCount, an overtaken car drops into rearCars
    // ONLY if (currentFrontCount + 1) > desiredFrontCount!
    // (e.g., on enter_shoulder in the far lane, currentFrontCount is 3 and desiredFrontCount is 4,
    // so 3 + 1 = 4 cars stay in front to fill the gap, and the existing rear car stays in rearCars!)
    const laneReceivesOvertakenCar =
      isShoulderManeuver &&
      (lane !== targetCopycatLane) &&
      (currentFrontCount > 0) &&
      (currentFrontCount + 1 > desiredFrontCount);

    if (laneReceivesOvertakenCar) {
      evictRearCarsInLane(lane, durationMs);
      return;
    }

    let laneRear = rearCars.filter(c => c.lane === lane && !c.removed);

    if (laneRear.length === 0) {
      const rc = spawnTrafficCar(595, lane, null, null, true);
      const targetY = baseRearY + rc.jitterY;
      setTimeout(() => {
        if (rc.departing || rc.removed) return;
        animateCarTo(rc, targetY, Math.round(durationMs * 0.92), 'cubic-bezier(.22,.75,.24,1)', 0.78);
      }, 90);
      return;
    }

    if (laneRear.length > 1) {
      for (let i = 1; i < laneRear.length; i++) {
        const extra = laneRear[i];
        extra.removed = true;
        if (extra.el) extra.el.remove();
      }
      rearCars = rearCars.filter(c => !c.removed);
    }

    const activeRear = laneRear[0];
    const restY = baseRearY + activeRear.jitterY;

    if (maneuverType === 'brake') {
      animateCarTo(activeRear, restY + 10, 220, 'ease-out', 1);
      setTimeout(() => {
        if (activeRear.departing || activeRear.removed) return;
        animateCarTo(activeRear, restY, 260, 'ease-out', 1);
      }, 230);
      return;
    }

    const halfDur = Math.round(durationMs * 0.46);
    const settleDur = Math.round(durationMs * 0.48);
    animateCarTo(activeRear, restY - 14, halfDur, 'cubic-bezier(.22,.75,.25,1)', 0);
    setTimeout(() => {
      if (activeRear.departing || activeRear.removed) return;
      animateCarTo(activeRear, restY, settleDur, 'cubic-bezier(.25,.72,.25,1)', 0.65);
    }, halfDur);
  });
}

function advanceTrafficForStep(durationMs, upcomingTrial, maneuverType, newPlayerLaneIdx) {
  const upcomingPhase = phaseOf(upcomingTrial);
  const isUpcomingCopycatTrial = (upcomingPhase === 'social_exposure' && socialCondition === 'experimental');
  const targetCopycatLane = isUpcomingCopycatTrial ? getCopycatLaneForPlayer(newPlayerLaneIdx) : null;

  updateRearTrafficForStep(durationMs, upcomingTrial, maneuverType, newPlayerLaneIdx, targetCopycatLane);

  ['right', 'left'].forEach(lane => {
    trafficCars.forEach(c => {
      if (c.lane === lane) c.isCopycat = false;
    });

    let laneCars = trafficCars
      .filter(car => car.lane === lane && !car.removed)
      .sort((a, b) => a.y - b.y);

    if (!isJamTrial(upcomingTrial)) {
      return;
    }

    const laneSlots = getLaneSlots(lane, newPlayerLaneIdx);
    const desiredCount = laneSlots.length; // 3 (adjacent/player lane) or 4 (far lane when player is on shoulder)

    // CASE 0: Emerging into the staggered traffic jam on Trial 2 -> Trial 3
    if (laneCars.length === 0) {
      for (let i = 0; i < desiredCount; i++) {
        const startY = -153 - (desiredCount - 1 - i) * 106;
        laneCars.push(spawnTrafficCar(startY, lane));
      }
      laneCars.forEach((car, idx) => {
        const destY = laneSlots[idx] + car.jitterY;
        animateCarTo(car, destY, durationMs, 'cubic-bezier(.20,.76,.24,1)', 0.76);
      });
      return;
    }

    // CASE 1: Entering a Social Exposure Trial in the Opposite Lane (targetCopycatLane)
    if (lane === targetCopycatLane) {
      while (laneCars.length < 3) {
        const topY = laneCars.length > 0 ? laneCars[0].y - 106 : -140;
        laneCars.unshift(spawnTrafficCar(topY, lane));
      }
      // If laneCars already had 4 cars (because player was already on the opposite shoulder),
      // drop the 4th car into rearCars so the 4-car Copycat platoon fits cleanly!
      while (laneCars.length > 3) {
        const tailCar = laneCars.pop();
        trafficCars = trafficCars.filter(c => c !== tailCar);
        evictRearCarsInLane(lane, durationMs);
        rearCars.push(tailCar);
        const baseRearY = getRearSlotForLane(lane, newPlayerLaneIdx);
        animateCarTo(tailCar, baseRearY + tailCar.jitterY, durationMs, 'cubic-bezier(.24,.72,.24,1)', 0.78);
      }

      const newLead = spawnTrafficCar(-140, lane);
      laneCars.unshift(newLead);

      const socialTargets = [SLOTS_ADJACENT_LANE[0], SLOTS_ADJACENT_LANE[1], SLOTS_ADJACENT_LANE[2], 334];
      laneCars[1].isCopycat = true;

      laneCars.forEach((car, idx) => {
        const destY = idx < 4 ? socialTargets[idx] : 600 + (idx - 4) * 106;
        animateCarTo(car, destY, Math.round(durationMs * 0.90), 'cubic-bezier(.25,.72,.25,1)', destY < 400 ? 0.70 : 0);
      });
      return;
    }

    // CASE 2: Player Exits to Shoulder OR Continues on Shoulder OR Overtakes & Merges Back
    if (maneuverType === 'enter_shoulder' || maneuverType === 'stay_shoulder' || maneuverType === 'overtake_and_merge') {
      while (laneCars.length < 3) {
        const topY = laneCars.length > 0 ? laneCars[0].y - 106 : -140;
        laneCars.unshift(spawnTrafficCar(topY, lane));
      }
      const newHorizonCar = spawnTrafficCar(-140, lane);
      laneCars.unshift(newHorizonCar);

      const delayMs = (maneuverType === 'enter_shoulder' || maneuverType === 'overtake_and_merge') ? 130 : 0;
      const moveDur = durationMs - delayMs;
      const baseRearY = getRearSlotForLane(lane, newPlayerLaneIdx);

      // Notice:
      // - In the ADJACENT lane (desiredCount === 3), laneCars[3] is overtaken and moves to rearCars, leaving 3 cars ahead (with merge gap open!).
      // - In the FAR lane (desiredCount === 4):
      //   * On enter_shoulder (had 3 cars -> now 4 cars), all 4 cars stay in trafficCars at [12, 120, 228, 336], filling the far-lane gap!
      //   * On stay_shoulder (had 4 cars -> now 5 cars), laneCars[4] moves to rearCars and 4 cars stay at [12, 120, 228, 336]!
      const overtakenCar = laneCars[desiredCount];
      if (overtakenCar) {
        trafficCars = trafficCars.filter(c => c !== overtakenCar);
        evictRearCarsInLane(lane, moveDur);
        rearCars.push(overtakenCar);
        setTimeout(() => {
          animateCarTo(overtakenCar, baseRearY + overtakenCar.jitterY, moveDur, 'cubic-bezier(.24,.72,.24,1)', 0.78);
        }, delayMs);
      }

      for (let idx = 0; idx < desiredCount; idx++) {
        const car = laneCars[idx];
        if (!car) continue;
        const destY = laneSlots[idx] + car.jitterY;
        setTimeout(() => {
          animateCarTo(car, destY, moveDur, 'cubic-bezier(.24,.72,.24,1)', 0.74);
        }, delayMs);
      }

      for (let idx = desiredCount + 1; idx < laneCars.length; idx++) {
        const extraCar = laneCars[idx];
        trafficCars = trafficCars.filter(c => c !== extraCar);
        animateCarTo(extraCar, 600, moveDur, 'ease-in', 0);
        setTimeout(() => {
          if (extraCar.el) extraCar.el.remove();
          extraCar.removed = true;
        }, moveDur + 50);
      }
      return;
    }

    // CASE 3: Normative Straight, Normative Lane Change, Merge Back from Shoulder, or Brake
    while (laneCars.length < desiredCount) {
      const topY = laneCars.length > 0 ? laneCars[0].y - 106 : -140;
      laneCars.unshift(spawnTrafficCar(topY, lane));
    }

    // If the player is merging back from the shoulder into the adjacent normative lane,
    // the FAR normative lane previously had 4 cars [12, 120, 228, 336] and now needs 3 cars [26, 128, 230]
    // so that its side-pocket at 338px opens up for the next trial!
    // We smoothly advance its front-most car (laneCars[0] at 12px) out the top (-135px),
    // while laneCars[1..3] advance forward from [120, 228, 336] into [26, 128, 230]!
    if (laneCars.length > desiredCount) {
      const exitingFrontCount = laneCars.length - desiredCount;
      for (let i = 0; i < exitingFrontCount; i++) {
        const frontExitCar = laneCars.shift();
        trafficCars = trafficCars.filter(c => c !== frontExitCar);
        animateCarTo(frontExitCar, -145 - i * 105, Math.round(durationMs * 0.82), 'cubic-bezier(.24,.72,.24,1)', 0);
        setTimeout(() => {
          if (frontExitCar.el) frontExitCar.el.remove();
          frontExitCar.removed = true;
        }, durationMs + 50);
      }
    }

    const pullForwardPx = (maneuverType === 'merge_back') ? 22 : (maneuverType === 'brake' ? 8 : 18);
    const halfDur = Math.round(durationMs * 0.44);
    const settleDur = Math.round(durationMs * 0.48);

    laneCars.forEach((car, idx) => {
      const restY = laneSlots[idx] + car.jitterY;
      const surgeY = restY - pullForwardPx;
      const stagger = idx * 45;

      setTimeout(() => {
        animateCarTo(car, surgeY, halfDur, 'cubic-bezier(.22,.75,.25,1)', 0);
      }, stagger);

      setTimeout(() => {
        animateCarTo(car, restY, settleDur, 'cubic-bezier(.25,.72,.25,1)', 0.65);
      }, stagger + halfDur);
    });
  });
}

// ==========================================
// 5. TWO-STAGE COPYCAT MANEUVER (Slow Cut-Out -> Straighten -> Fast Acceleration)
// ==========================================
function runCopycatDemonstration(onComplete) {
  const copycat = trafficCars.find(c => c.isCopycat && !c.removed);
  if (!copycat || !copycat.el) {
    onComplete();
    return;
  }

  const copycatLane = copycat.lane;
  const targetShoulder = (copycatLane === 'left') ? 'leftShoulder' : 'shoulder';
  currentCopycat = { id: copycat.roofId, fromLane: copycatLane, toLane: targetShoulder };
  const blinkClass = (copycatLane === 'left') ? 'blink-left' : 'blink-right';
  const steerClass = (copycatLane === 'left') ? 'steer-left' : 'steer-right';

  const followers = trafficCars
    .filter(c => c.lane === copycatLane && !c.removed && c !== copycat && c.y > copycat.y)
    .sort((a, b) => a.y - b.y);

  setTimeout(() => {
    if (!copycat.el) {
      onComplete();
      return;
    }

    copycat.el.classList.add(blinkClass);

    setTimeout(() => {
      if (!copycat.el) {
        onComplete();
        return;
      }
      copycat.el.classList.remove('braking');
      copycat.el.classList.add(steerClass);
      copycat.el.style.transition = 'left 1.08s cubic-bezier(.25,.78,.25,1), top 1.15s cubic-bezier(.32,.64,.35,1)';
      copycat.el.style.left = laneX(targetShoulder) + '%';
      copycat.lane = targetShoulder;
      copycat.y = 80;
      copycat.el.style.top = '80px';

      setTimeout(() => {
        // If the player is currently on the opposite shoulder, the Copycat's lane is the FAR lane,
        // so we also advance its rear car into Slot 3 (336px) to keep the far lane completely full!
        const copycatLaneIsFar = isFarLaneWhenOnShoulder(copycatLane, playerLaneIdx);
        const targetFillSlots = copycatLaneIsFar
          ? [SLOTS_FAR_LANE[1], SLOTS_FAR_LANE[2]]
          : [SLOTS_ADJACENT_LANE[1], SLOTS_ADJACENT_LANE[2]];

        followers.forEach((follower, idx) => {
          if (idx >= targetFillSlots.length || !follower.el) return;
          setTimeout(() => {
            animateCarTo(
              follower,
              targetFillSlots[idx] + follower.jitterY,
              850,
              'cubic-bezier(.25,.72,.25,1)',
              0.72
            );
          }, idx * 150);
        });

        if (copycatLaneIsFar) {
          const laneRear = rearCars.filter(c => c.lane === copycatLane && !c.removed);
          if (laneRear.length > 0) {
            const promotedRear = laneRear[0];
            rearCars = rearCars.filter(c => c !== promotedRear);
            trafficCars.push(promotedRear);
            setTimeout(() => {
              animateCarTo(
                promotedRear,
                SLOTS_FAR_LANE[3] + promotedRear.jitterY,
                850,
                'cubic-bezier(.25,.72,.25,1)',
                0.72
              );
            }, 300);

            const replacementRear = spawnTrafficCar(595, copycatLane, null, null, true);
            setTimeout(() => {
              animateCarTo(
                replacementRear,
                CFG.rearSlotFarY + replacementRear.jitterY,
                900,
                'cubic-bezier(.22,.75,.24,1)',
                0.78
              );
            }, 340);
          }
        }
      }, 620);

      setTimeout(() => {
        if (!copycat.el) {
          onComplete();
          return;
        }
        copycat.el.classList.remove(steerClass);
        copycat.el.style.transition = 'top 1.85s cubic-bezier(.38,.12,.22,1)';
        copycat.y = -165;
        copycat.el.style.top = '-165px';

        setTimeout(() => {
          if (copycat.el) copycat.el.classList.remove(blinkClass);
        }, 320);

        setTimeout(() => {
          if (copycat.el) copycat.el.remove();
          copycat.removed = true;
          trafficCars = trafficCars.filter(c => !c.removed);
          onComplete();
        }, 1900);
      }, 1120);
    }, 650);
  }, 450);
}

function pruneOffscreenWorld() {
  document.querySelectorAll('.scenery, .guard-postL, .guard-postR').forEach(el => {
    const y = parseFloat(el.style.top || 0);
    if (worldToScreenY(y) > 680) el.remove();
  });
  trafficCars.forEach(c => {
    if (c.y > 550 || c.y < -380) {
      if (c.el) c.el.remove();
      c.removed = true;
    }
  });
  trafficCars = trafficCars.filter(c => !c.removed);

  rearCars.forEach(c => {
    if (c.y > 560 || c.y < -380) {
      if (c.el) c.el.remove();
      c.removed = true;
    }
  });
  rearCars = rearCars.filter(c => !c.removed);
}

function setLocked(v) {
  locked = v;
  buttons.forEach(b => b.disabled = v);
}

function pulseScoreHud(type) {
  const box = $('scoreBox');
  const cls = type === 'gain' ? 'pulse-gain' : 'pulse-loss';
  box.classList.remove('pulse-gain', 'pulse-loss');
  void box.offsetWidth;
  box.classList.add(cls);
  setTimeout(() => box.classList.remove(cls), 380);
}

function showCenterExpandingFeedback(el, text, durationMs, newScoreVal, pulseType) {
  el.textContent = text;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = `expandCenter ${durationMs}ms cubic-bezier(.18,.68,.28,1) forwards`;

  score = newScoreVal;
  $('score').textContent = score;
  pulseScoreHud(pulseType);
}

function nextDecision() {
  trial++;
  if (trial > totalTrials()) return finish();

  const phase = phaseOf(trial);
  // Phase names are shown only in test mode (they would reveal the design to participants).
  $('phase').textContent = CFG.testMode ? 'TEST MODE · ' + phase.replace('_', ' ') : '';
  $('trial').textContent = `Trial ${trial} / ${totalTrials()}`;

  // Reset per-trial logging counters
  trialHiddenCount = 0;
  trialBlurCount = 0;
  currentCopycat = null;
  inputDuringCopycat = 0;

  if (phase === 'social_exposure' && socialCondition === 'experimental') {
    setLocked(true);
    copycatRunning = true;
    runCopycatDemonstration(() => {
      copycatRunning = false;
      setLocked(false);
      trialStarted = performance.now();
    });
  } else {
    setLocked(false);
    trialStarted = performance.now();
  }
}

function choose(key) {
  if (locked) {
    if (copycatRunning) inputDuringCopycat++;
    return;
  }
  if (!['ArrowUp', 'ArrowLeft', 'ArrowRight', 'ArrowDown'].includes(key)) return;

  setLocked(true);
  const rt = Math.round(performance.now() - trialStarted);
  const p = $('player');
  const phase = phaseOf(trial);

  const laneBefore = LANES[playerLaneIdx];
  const wasOnShoulder = (laneBefore === 'shoulder' || laneBefore === 'leftShoulder');

  // ==========================================
  // CASE A: DOWN ARROW -> ACTIVE BRAKING (-5 points, PLUS FINE IF STAYING ON SHOULDER IN DETERRENCE!)
  // ==========================================
  if (key === 'ArrowDown') {
    p.classList.add('braking', 'hard-brake');
    p.style.transition = 'top 0.22s ease-out';
    p.style.top = (playerScreenY + 8) + 'px';
    setTimeout(() => { p.style.top = playerScreenY + 'px'; }, 240);

    seedSceneryUpTo(screenToWorldY(-1100));
    advanceTrafficForStep(CFG.brakeMs, trial + 1, 'brake', playerLaneIdx);

    worldOffset += CFG.brakeStepDist;
    const w = $('world');
    w.style.transition = `transform ${CFG.brakeMs}ms ease-out`;
    requestAnimationFrame(() => {
      w.style.transform = `translateY(${worldOffset}px)`;
    });

    setTimeout(() => {
      p.classList.remove('hard-brake');
      pruneOffscreenWorld();

      // If player is braking while on the shoulder during deterrence phase, roll for shoulder fine!
      let fine = 0;
      const fineEligible = (wasOnShoulder && phase === 'deterrence');
      if (fineEligible) {
        const rule = CFG[deterrenceCondition];
        if (Math.random() < rule.p) fine = rule.fine;
      }

      const scoreAfterBrake = Math.max(0, score - CFG.brakeCost);
      const finalScore = Math.max(0, scoreAfterBrake - fine);

      const brakeHoldMs = fine > 0 ? 1000 : 1150;
      const fineHoldMs = 1350;

      // Show braking cost (-5) in the center
      showCenterExpandingFeedback($('loss'), '−' + CFG.brakeCost, brakeHoldMs, scoreAfterBrake, 'loss');

      // If fined for remaining on the shoulder, show the fine 1 second later!
      if (fine > 0) {
        setTimeout(() => {
          const fineLabel = TXT[lang].finePrefix + fine;
          showCenterExpandingFeedback($('loss'), fineLabel, fineHoldMs, finalScore, 'loss');
        }, 1000);
      }

      records.push({
        ...baseRecord(),
        key,
        lane_before: laneBefore,
        lane_after: laneBefore,
        choice: 'brake',
        maneuver_type: 'brake',
        is_violation: wasOnShoulder,
        violation_type: wasOnShoulder ? 'continuation' : 'none',
        reward: -CFG.brakeCost,
        fine_eligible: fineEligible,
        fine,
        score_after: finalScore,
        rt
      });

      const nextTrialDelayMs = fine > 0 ? (1000 + fineHoldMs) : brakeHoldMs;
      setTimeout(nextDecision, nextTrialDelayMs);
    }, CFG.brakeMs);
    return;
  }

  // ==========================================
  // CASE B: TWO-STAGE COLLISION-FREE FORWARD & LATERAL NAVIGATION
  // ==========================================
  let newLaneIdx = playerLaneIdx;
  if (key === 'ArrowLeft') newLaneIdx = Math.max(0, playerLaneIdx - 1);
  if (key === 'ArrowRight') newLaneIdx = Math.min(LANES.length - 1, playerLaneIdx + 1);

  const changedLane = (newLaneIdx !== playerLaneIdx);
  const moveDir = newLaneIdx > playerLaneIdx ? 'right' : (newLaneIdx < playerLaneIdx ? 'left' : 'straight');
  playerLaneIdx = newLaneIdx;
  let laneAfter = LANES[playerLaneIdx];

  const isShoulder = (laneAfter === 'shoulder' || laneAfter === 'leftShoulder');
  const isOvertakeAndMergeMode = (isShoulder && shoulderMode === 'merge');

  const isEnteringShoulder = (!wasOnShoulder && isShoulder && !isOvertakeAndMergeMode);
  const isStayingOnShoulder = (wasOnShoulder && isShoulder && !isOvertakeAndMergeMode);
  const isMergingBackToLane = (wasOnShoulder && !isShoulder);

  let maneuverType = 'normative_straight';
  if (isOvertakeAndMergeMode) maneuverType = 'overtake_and_merge';
  else if (isEnteringShoulder) maneuverType = 'enter_shoulder';
  else if (isStayingOnShoulder) maneuverType = 'stay_shoulder';
  else if (isMergingBackToLane) maneuverType = 'merge_back';
  else if (changedLane) maneuverType = 'normative_lane_change';

  const violationType = isShoulder ? (wasOnShoulder ? 'continuation' : 'initiation') : 'none';

  const reward = isShoulder
    ? CFG.shoulderReward
    : (isJamTrial(trial) ? CFG.jamNormativeReward : CFG.openRoadReward);

  const stepDist = isShoulder ? CFG.shoulderStepDist : CFG.stepDist;
  const isJammedNormative = (isJamTrial(trial) && !isShoulder);
  const driveDuration = isShoulder
    ? CFG.shoulderDriveMs
    : (isJamTrial(trial) ? CFG.jamDriveMs : CFG.freeDriveMs);

  const finalLaneIdxAfterStep = isOvertakeAndMergeMode
    ? (laneAfter === 'shoulder' ? 2 : 1)
    : playerLaneIdx;

  const targetPlayerY = (isShoulder && !isOvertakeAndMergeMode && isJamTrial(trial + 1))
    ? CFG.playerShoulderY
    : CFG.playerNormY;

  seedSceneryUpTo(screenToWorldY(-1100));

  p.classList.remove('blink-left', 'blink-right', 'steer-left', 'steer-right');
  const turnLeadMs = changedLane ? 120 : 0;

  if (changedLane) {
    p.classList.add(moveDir === 'left' ? 'blink-left' : 'blink-right');
  }

  setTimeout(() => {
    p.classList.remove('braking');

    if (isOvertakeAndMergeMode) {
      const shoulderName = laneAfter;
      const returnLaneIdx = finalLaneIdxAfterStep;
      const returnLaneName = LANES[returnLaneIdx];
      const returnDir = returnLaneIdx < playerLaneIdx ? 'left' : 'right';

      p.style.transition = 'left 0.34s cubic-bezier(.22,.86,.24,1), top 0.48s cubic-bezier(.22,.76,.24,1)';
      p.classList.add(moveDir === 'left' ? 'steer-left' : 'steer-right');
      p.style.left = laneX(shoulderName) + '%';
      p.style.top = '280px';

      setTimeout(() => {
        p.classList.remove('steer-left', 'steer-right', 'blink-left', 'blink-right');
      }, 360);

      setTimeout(() => {
        p.classList.add(returnDir === 'left' ? 'blink-left' : 'blink-right');
        p.classList.add(returnDir === 'left' ? 'steer-left' : 'steer-right');
        p.style.top = CFG.playerNormY + 'px';
        p.style.left = laneX(returnLaneName) + '%';
        playerLaneIdx = returnLaneIdx;
        playerScreenY = CFG.playerNormY;
      }, Math.round(driveDuration * 0.60));

      setTimeout(() => {
        p.classList.remove('steer-left', 'steer-right');
      }, Math.round(driveDuration * 0.88));
    }
    else if (isEnteringShoulder) {
      p.style.transition = 'left 0.35s cubic-bezier(.22,.86,.24,1), top 0.66s cubic-bezier(.22,.76,.24,1)';
      p.classList.add(moveDir === 'left' ? 'steer-left' : 'steer-right');
      p.style.left = laneX(laneAfter) + '%';

      setTimeout(() => {
        p.style.top = targetPlayerY + 'px';
        playerScreenY = targetPlayerY;
      }, 150);

      setTimeout(() => {
        p.classList.remove('steer-left', 'steer-right');
      }, 420);
      setTimeout(() => {
        p.classList.remove('blink-left', 'blink-right');
      }, 640);
    }
    else if (isStayingOnShoulder) {
      p.style.transition = 'left 0.42s ease, top 0.46s cubic-bezier(.22,.76,.24,1)';
      p.style.top = (targetPlayerY - 14) + 'px';
      playerScreenY = targetPlayerY;
      setTimeout(() => {
        p.style.top = targetPlayerY + 'px';
      }, 460);
    }
    else if (isMergingBackToLane) {
      p.style.transition = 'top 0.44s cubic-bezier(.25,.76,.25,1), left 0.42s cubic-bezier(.22,.82,.25,1)';
      p.style.top = targetPlayerY + 'px';
      playerScreenY = targetPlayerY;

      setTimeout(() => {
        p.classList.add(moveDir === 'left' ? 'steer-left' : 'steer-right');
        p.style.left = laneX(laneAfter) + '%';
      }, 410);

      setTimeout(() => {
        p.classList.remove('steer-left', 'steer-right');
      }, 800);
      setTimeout(() => {
        p.classList.remove('blink-left', 'blink-right');
      }, 860);
    }
    else if (changedLane) {
      p.style.transition = 'left 0.45s cubic-bezier(.22,.82,.25,1), top 0.45s ease-out';
      p.classList.add(moveDir === 'left' ? 'steer-left' : 'steer-right');
      p.style.left = laneX(laneAfter) + '%';
      p.style.top = (targetPlayerY - 12) + 'px';
      playerScreenY = targetPlayerY;

      setTimeout(() => {
        p.classList.remove('steer-left', 'steer-right');
        p.style.top = targetPlayerY + 'px';
      }, 430);
      setTimeout(() => {
        p.classList.remove('blink-left', 'blink-right');
      }, 620);
    }
    else {
      p.style.transition = 'top 0.50s cubic-bezier(.22,.75,.25,1)';
      p.style.top = (targetPlayerY - 20) + 'px';
      playerScreenY = targetPlayerY;
      setTimeout(() => {
        p.style.top = targetPlayerY + 'px';
      }, 520);
    }

    advanceTrafficForStep(driveDuration, trial + 1, maneuverType, finalLaneIdxAfterStep);

    worldOffset += stepDist;
    const w = $('world');
    const base = $('roadbase');
    base.classList.add('driving');
    if (isShoulder) base.classList.add('fast');
    else if (isJammedNormative) base.classList.add('crawl');

    w.style.transition = `transform ${driveDuration}ms cubic-bezier(.22,.72,.22,1)`;
    requestAnimationFrame(() => {
      w.style.transform = `translateY(${worldOffset}px)`;
    });

    setTimeout(() => {
      p.classList.remove('blink-left', 'blink-right', 'steer-left', 'steer-right');
      p.classList.add('braking');
    }, Math.round(driveDuration * 0.88));

    setTimeout(() => {
      base.classList.remove('driving', 'fast', 'crawl');
      pruneOffscreenWorld();

      let fine = 0;
      const fineEligible = (isShoulder && phase === 'deterrence');
      if (fineEligible) {
        const rule = CFG[deterrenceCondition];
        if (Math.random() < rule.p) fine = rule.fine;
      }

      const scoreAfterReward = score + reward;
      const finalScore = Math.max(0, scoreAfterReward - fine);

      const gainHoldMs = fine > 0 ? 1000 : 1150;
      const fineHoldMs = 1350;

      showCenterExpandingFeedback($('gain'), '+' + reward, gainHoldMs, scoreAfterReward, 'gain');

      if (fine > 0) {
        setTimeout(() => {
          $('gain').style.animation = 'none';
          $('gain').style.opacity = '0';
          const fineLabel = TXT[lang].finePrefix + fine;
          showCenterExpandingFeedback($('loss'), fineLabel, fineHoldMs, finalScore, 'loss');
        }, 1000);
      }

      records.push({
        ...baseRecord(),
        key,
        lane_before: laneBefore,
        lane_after: LANES[playerLaneIdx],
        choice: isShoulder ? laneAfter : (changedLane ? moveDir : 'straight'),
        maneuver_type: maneuverType,
        is_violation: isShoulder,
        violation_type: violationType,
        reward,
        fine_eligible: fineEligible,
        fine,
        score_after: finalScore,
        rt
      });

      const nextTrialDelayMs = fine > 0 ? (1000 + fineHoldMs) : gainHoldMs;
      setTimeout(nextDecision, nextTrialDelayMs);
    }, driveDuration);
  }, turnLeadMs);
}

document.addEventListener('keydown', e => {
  if (e.key.startsWith('Arrow')) e.preventDefault();
  // Ignore auto-repeat from a held key: every choice must be a fresh press
  // (otherwise holding "up" produces near-zero RTs and inflates "staying on the shoulder").
  if (e.repeat) return;
  choose(e.key);
});
buttons.forEach(b => b.onclick = () => choose(b.dataset.key));

let experimentEndIso = '';
let experimentDurationMs = 0;
function finish() {
  setLocked(true);
  experimentEndIso = new Date().toISOString();
  experimentDurationMs = Math.round(performance.now() - experimentStartPerf);
  $('overlay').classList.remove('hidden');
  $('overlay').innerHTML = `
    <div class="card">
      <h1>${TXT[lang].done}</h1>
      <p>${TXT[lang].points}: <b>${score}</b></p>
      <button class="btn" id="download">${TXT[lang].download}</button>
      <button class="btn secondary" onclick="location.reload()">${TXT[lang].restart}</button>
    </div>
  `;
  $('download').onclick = () => {
    const payload = {
      version: VERSION,
      session,
      participantId,
      tag: playerTag,
      testMode: CFG.testMode,
      socialCondition,
      deterrenceCondition,
      shoulderMode,
      assignmentSource,
      startedAt: experimentStartIso,
      endedAt: experimentEndIso,
      durationMs: experimentDurationMs,
      userAgent: navigator.userAgent,
      screen: { w: window.screen.width, h: window.screen.height, viewportW: window.innerWidth, viewportH: window.innerHeight },
      config: CFG,
      finalScore: score,
      records,
      events
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${session}_data.json`;
    a.click();
  };
}
</script>
